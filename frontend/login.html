<!DOCTYPE html>

<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login - Fitness Planner</title>
    <link rel="stylesheet" href="src/output.css">
</head>


<body class="bg-[#0B1220] text-[#F8FAFC] font-sans antialiased min-h-screen flex items-center justify-center p-4">

    <main class="w-full max-w-md bg-[#111C2E] border border-slate-700 rounded-2xl p-6 sm:p-8 space-y-6">
        
        <div class="text-center space-y-2">
            <h1 class="text-3xl font-bold text-emerald-500">Fitness Planner</h1>
            <p class="text-[#94A3B8] text-sm">Welcome back! Please login to your account.</p>
        </div>


        <form action="workout.html" class="space-y-4">

            <div>
                <label class="block text-sm font-semibold mb-2" for="email">Email</label>
                <input type="email" id="email" placeholder="name@example.com" required
                    class="w-full bg-slate-800 border border-slate-600 text-slate-100 placeholder-slate-400 rounded-lg px-4 py-3 focus:outline-none focus:ring-2 focus:ring-emerald-500">
            </div>

            <div>
                <label class="block text-sm font-semibold mb-2" for="password">Password</label>
                <input type="password" id="password" placeholder="••••••••" required minlength="6"
                    class="w-full bg-slate-800 border border-slate-600 text-slate-100 placeholder-slate-400 rounded-lg px-4 py-3 focus:outline-none focus:ring-2 focus:ring-emerald-500">
            </div>

            <div class="flex justify-end">
                <a href="#" class="text-sm text-[#38BDF8] hover:underline">Forgot password?</a>
            </div>

            <button type="submit" class="w-full bg-emerald-500 hover:bg-emerald-400 text-emerald-950 font-semibold rounded-lg px-4 py-3 transition-colors">
                Login
            </button>

        </form>

        <div class="text-center text-sm text-[#94A3B8]">
            Don't have an account? 
            <a href="register.html" class="text-emerald-500 font-semibold hover:underline">Register here</a>
        </div>

    </main>
    
</body>


</html>
