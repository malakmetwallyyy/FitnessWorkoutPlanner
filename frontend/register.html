<!DOCTYPE html>

<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Register - Fitness Planner</title>
    <link rel="stylesheet" href="src/output.css">
</head>


<body class="bg-[#0B1220] text-[#F8FAFC] font-sans antialiased min-h-screen flex items-center justify-center p-4">

    <main class="w-full max-w-lg bg-[#111C2E] border border-slate-700 rounded-2xl p-6 sm:p-8 space-y-6 my-8">
        
        <div class="text-center space-y-2">
            <h1 class="text-3xl font-bold text-emerald-500">Create Account</h1>
            <p class="text-[#94A3B8] text-sm">Join us and start tracking your fitness journey.</p>
        </div>


        <form class="space-y-4">
            <div class="grid grid-cols-1 md:grid-cols-2 gap-4">
                <div>
                    <label class="block text-sm font-semibold mb-2" for="fullName">Full Name</label>
                    <input type="text" id="fullName" placeholder="John Doe" required class="w-full bg-slate-800 border border-slate-600 text-slate-100 placeholder-slate-400 rounded-lg px-4 py-3 focus:outline-none focus:ring-2 focus:ring-emerald-500">
                </div>
                <div>
                    <label class="block text-sm font-semibold mb-2" for="dob">Date of Birth</label>
                    <input type="date" id="dob" required class="w-full bg-slate-800 border border-slate-600 text-slate-100 placeholder-slate-400 rounded-lg px-4 py-3 focus:outline-none focus:ring-2 focus:ring-emerald-500">
                </div>
            </div>


            <div class="grid grid-cols-1 md:grid-cols-2 gap-4">
                <div>
                    <label class="block text-sm font-semibold mb-2" for="gender">Gender</label>
                    <select id="gender" class="w-full bg-slate-800 border border-slate-600 text-slate-100 rounded-lg px-4 py-3 focus:outline-none focus:ring-2 focus:ring-emerald-500">
                        <option>Male</option>
                        <option>Female</option>
                        <option>Other</option>
                    </select>
                </div>

                <div>
                    <label class="block text-sm font-semibold mb-2" for="goal">Fitness Goal</label>
                    <select id="goal" class="w-full bg-slate-800 border border-slate-600 text-slate-100 rounded-lg px-4 py-3 focus:outline-none focus:ring-2 focus:ring-emerald-500">
                        <option>Lose Fat</option>
                        <option>Build Muscle</option>
                        <option>Improve Fitness</option>
                    </select>
                </div>
            </div>


            <div>
                <label class="block text-sm font-semibold mb-2" for="regEmail">Email</label>
                <input type="email" id="regEmail" placeholder="name@example.com" required class="w-full bg-slate-800 border border-slate-600 text-slate-100 placeholder-slate-400 rounded-lg px-4 py-3 focus:outline-none focus:ring-2 focus:ring-emerald-500">
            </div>


            <div class="grid grid-cols-1 md:grid-cols-2 gap-4">
                <div>
                    <label class="block text-sm font-semibold mb-2" for="regPassword">Password</label>
                    <input type="password" id="regPassword" placeholder="••••••••" required minlength="6" class="w-full bg-slate-800 border border-slate-600 text-slate-100 placeholder-slate-400 rounded-lg px-4 py-3 focus:outline-none focus:ring-2 focus:ring-emerald-500">
                </div>
                <div>
                    <label class="block text-sm font-semibold mb-2" for="confirmPassword">Confirm Password</label>
                    <input type="password" id="confirmPassword" placeholder="••••••••" required minlength="6" class="w-full bg-slate-800 border border-slate-600 text-slate-100 placeholder-slate-400 rounded-lg px-4 py-3 focus:outline-none focus:ring-2 focus:ring-emerald-500">
                </div>
            </div>

            <button type="submit" class="w-full mt-6 bg-emerald-500 hover:bg-emerald-400 text-emerald-950 font-semibold rounded-lg px-4 py-3 transition-colors">
                Create Account
            </button>
        </form>

        <div class="text-center text-sm text-[#94A3B8]">
            Already have an account? 
            <a href="login.html" class="text-emerald-500 font-semibold hover:underline">Login here</a>
        </div>
    </main>

</body>


</html>
