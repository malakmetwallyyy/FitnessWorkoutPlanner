<!DOCTYPE html>

<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Workout - Fitness Planner</title>
    <link rel="stylesheet" href="src/output.css">
</head>

<body class="bg-[#0B1220] text-[#F8FAFC] font-sans antialiased min-h-screen">

    <main class="max-w-7xl mx-auto p-4 sm:p-6 lg:p-8 space-y-8">
        

        <header class="flex justify-between items-center border-b border-slate-700 pb-6">
            <div>
                <h1 class="text-3xl md:text-4xl font-bold text-emerald-500">Active Workout</h1>
                <p class="text-[#94A3B8] mt-2">Chest & Triceps Routine</p>
            </div>
            <button class="bg-red-500 hover:bg-red-400 text-white font-semibold rounded-lg px-4 py-2">
                End Workout
            </button>
        </header>


        <section class="bg-[#111C2E] border border-slate-700 rounded-xl p-5 flex justify-between items-center">
            <div class="text-center">
                <p class="text-[#94A3B8] text-sm">Workout Time</p>
                <p class="text-3xl font-bold text-white">45:20</p>
            </div>
            <div class="text-center">
                <p class="text-[#94A3B8] text-sm">Rest Timer</p>
                <p class="text-3xl font-bold text-[#38BDF8]">01:30</p>
            </div>
        </section>


        <section class="bg-[#111C2E] border border-slate-700 rounded-xl p-5 space-y-4">
            <h2 class="text-xl md:text-2xl font-semibold text-emerald-400">Barbell Bench Press</h2>
            

            <div class="grid grid-cols-4 gap-4 text-[#94A3B8] text-sm text-center font-semibold pb-2 border-b border-slate-700">
                <div>Set</div>
                <div>Weight (kg)</div>
                <div>Reps</div>
                <div>Done</div>
            </div>


            <div class="grid grid-cols-4 gap-4 items-center text-center">
                <div class="font-bold">1</div>
                <div><input type="number" aria-label="Set 1 weight in kg" value="60" class="w-full bg-slate-800 border border-slate-600 rounded px-2 py-1 text-center text-white"></div>
                <div><input type="number" aria-label="Set 1 repetitions" value="10" class="w-full bg-slate-800 border border-slate-600 rounded px-2 py-1 text-center text-white"></div>
                <div><input type="checkbox" aria-label="Mark set 1 as done" checked class="w-5 h-5 accent-emerald-500 rounded"></div>
            </div>


            <div class="grid grid-cols-4 gap-4 items-center text-center">
                <div class="font-bold">2</div>
                <div><input type="number" aria-label="Set 2 weight in kg" value="65" class="w-full bg-slate-800 border border-slate-600 rounded px-2 py-1 text-center text-white"></div>
                <div><input type="number" aria-label="Set 2 repetitions" value="8" class="w-full bg-slate-800 border border-slate-600 rounded px-2 py-1 text-center text-white"></div>
                <div><input type="checkbox" aria-label="Mark set 2 as done" class="w-5 h-5 accent-emerald-500 rounded"></div>
            </div>

            <button class="w-full border border-slate-600 text-slate-100 hover:bg-slate-800 rounded-lg px-4 py-2 mt-4">
                + Add Set
            </button>
        </section>


        <button class="w-full bg-emerald-500 hover:bg-emerald-400 text-emerald-950 font-bold rounded-lg px-4 py-4 text-lg">
            + Add Another Exercise
        </button>

    </main>

</body>


</html>
